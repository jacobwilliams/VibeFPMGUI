[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "VibeFPMGUI"
platforms = ["osx-arm64", "linux-64", "win-64", "linux-aarch64"]
version = "0.0.6"

[tasks]
start = "python -m vibefpmgui"
demo = "python -m vibefpmgui examples/demo"
test = "pytest"                                             # GUI and unit tests (no windows appear; see tests/conftest.py)
coverage = "pytest --cov --cov-report=html --cov-report=term"  # the tests, with a code coverage report in web/coverage
docs = "pdoc -t docs/pdoc-template -o web/api vibefpmgui"   # API docs (HTML) from the docstrings, into the website
docs-serve = "pdoc -t docs/pdoc-template vibefpmgui"        # the same, live in the browser while you edit
lint = "ruff check ."                                       # lint the package and the tests (ruff's default rules)
audit = "bandit -c pyproject.toml -r vibefpmgui"            # security check (bandit; known-acceptable checks: see pyproject.toml)

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = ">=3.14.8,<3.15"
pyside6 = ">=6.11.1,<7"
qtpy = ">=2.4.3,<3"
pygments = ">=2.21.0,<3"
pyqtgraph = ">=0.14.0,<0.15"
ollama = ">=0.32.15,<0.33"
ollama-python = ">=0.6.3,<0.7"
pathspec = ">=1.1.1,<2"
ruff = ">=0.17.0,<0.18"
lfortran = ">=0.67.0,<0.68"
fprettify = ">=0.3.7,<0.4"
fortls = ">=3.2.2,<4"
pdoc = ">=16.0.0,<17"
pytest = ">=9.1.1,<10"
pytest-qt = ">=4.5.0,<5"
pytest-timeout = ">=2.4.0,<3"
pytest-cov = ">=7.1.0,<8"
pyte = ">=0.8.2,<0.9"
pyspellchecker = ">=0.8.0,<0.9"
bandit = ">=1.9.4,<2"

[pypi-dependencies]
fortitude-lint = ">=0.9.2, <0.10"

[target.win-64.dependencies]
pywinpty = ">=3.0.5,<4"

[target.linux-aarch64.dependencies]
gdb = ">=18.1,<19"
gxx = "15.*"
valgrind = ">=3.27.1,<4"

[target.linux-64.dependencies]
gdb = ">=18.1,<19"
gxx = "15.*"
valgrind = ">=3.27.1,<4"
