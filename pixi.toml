[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "VibeFPMGUI"
platforms = ["osx-arm64", "linux-64", "win-64"]
version = "0.0.3"

[tasks]
start = "python -m vibefpmgui"
demo = "python -m vibefpmgui examples/demo"
docs = "pdoc -o web/api vibefpmgui"       # API docs (HTML) from the docstrings, into the website
docs-serve = "pdoc vibefpmgui"            # the same, live in the browser while you edit

[dependencies]
gfortran = "15.*"
fpm = ">=0.13.0,<0.14"
python = ">=3.14.8,<3.15"
pyside6 = ">=6.11.1,<7"
qtpy = ">=2.4.3,<3"
pygments = ">=2.21.0,<3"
pyqtgraph = ">=0.14.0,<0.15"
ollama = ">=0.32.15,<0.33"
ollama-python = ">=0.6.3,<0.7"
pathspec = ">=1.1.1,<2"
ruff = ">=0.17.0,<0.18"
lfortran = ">=0.67.0,<0.68"
fprettify = ">=0.3.7,<0.4"
fortls = ">=3.2.2,<4"
pdoc = ">=16.0.0,<17"

[pypi-dependencies]
fortitude-lint = ">=0.9.2, <0.10"
