name: CI
on: [push]
jobs:

  Build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        submodules: recursive

    # installs pixi and creates the environment from pixi.toml/pixi.lock
    # (gfortran, fpm, ford, graphviz, ...), the same one used locally
    - name: Setup pixi environment
      uses: prefix-dev/setup-pixi@v0.10.2
      with:
        pixi-version: v0.80.0
        locked: true   # fail if pixi.lock is out of date with pixi.toml
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/master' }}

    # Lint the package and the tests (ruff, the locked version: the same
    # rules as locally). Fails the build on any finding.
    - name: Lint (ruff)
      run: pixi run lint

    # Security check (bandit): fails the build if it finds anything. The
    # checks that don't apply to an app that runs programs are skipped, with
    # the reasons, in pyproject.toml's [tool.bandit]. Before the tests: it takes seconds.
    - name: Security audit (bandit)
      run: pixi run audit

    # Valgrind (in the pixi environment) needs the C library's debug symbols
    # to start: the system's, not in the environment (the Valgrind tests skip
    # themselves without them).
    - name: Install the C library's debug symbols (for Valgrind)
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libc6-dbg

    # GUI and unit tests (pytest + pytest-qt), with an HTML code coverage
    # report in web/coverage (deployed with the website, linked from the API
    # docs). There's no display on the runner: Qt draws offscreen
    # (tests/conftest.py sets this too). coverage.py puts a .gitignore of "*"
    # in the report's folder, which would keep it out of the gh-pages commit.
    - name: Run tests (with code coverage)
      run: |
        pixi run coverage
        rm -f web/coverage/.gitignore
      env:
        QT_QPA_PLATFORM: offscreen

    # API docs from the docstrings (pdoc), into web/api so they're deployed
    # with the website. pdoc imports the package, which imports Qt: no display
    # is needed, but tell Qt not to look for one.
    - name: Build API documentation
      run: pixi run docs
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Deploy Documentation
      if: github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@v4.9.0
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: web  # The folder the action should deploy.
        single-commit: true
