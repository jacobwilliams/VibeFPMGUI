[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vibefpmgui"
dynamic = ["version"]
description = "A Qt GUI for the Fortran Package Manager (fpm): build, run and test fpm projects, with a dependency graph, live build/test progress and a built-in editor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Jacob Williams", email = "jacobwilliams@users.noreply.github.com" }]
requires-python = ">=3.11"  # tomllib
keywords = ["fortran", "fpm", "package manager", "gui", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
# Keep in step with [dependencies] in pixi.toml. fpm and a Fortran compiler
# (e.g. gfortran) are also needed at run time but aren't Python packages
# (fpm is also on PyPI as "fpm").
dependencies = [
    "qtpy>=2.4.3",
    "PySide6>=6.11.1",   # the Qt binding qtpy uses (the only one tested)
    "pyqtgraph>=0.14.0", # dependency graph drawing
    "numpy",             # force-directed layout (also required by pyqtgraph)
    "pygments>=2.21.0",  # syntax highlighting
    "pathspec>=1.1.1",   # .gitignore matching in the file tree
    "pyte>=0.8.2",       # the Terminal tab's terminal emulation
    "pyspellchecker>=0.8.0",  # spell checking comments and strings in the editor
    "pywinpty>=2.0.1; sys_platform == 'win32'",  # (and its shell on Windows)
]

[project.optional-dependencies]
# AI code review with a local model. Also needs the Ollama server
# (https://ollama.com, or "ollama" from conda-forge) and a model,
# e.g. "ollama pull qwen2.5-coder:7b".
ai = ["ollama>=0.6.3"]
# Editor support for Fortran files: language server, linter and formatter.
fortran = ["fortls>=3.2", "fortitude-lint>=0.9", "fprettify>=0.3.7"]

[project.urls]
Homepage = "https://github.com/jacobwilliams/VibeFPMGUI"
Source = "https://github.com/jacobwilliams/VibeFPMGUI"
"Fortran Package Manager" = "https://fpm.fortran-lang.org"

[project.gui-scripts]
vibefpmgui = "vibefpmgui.main_window:main"

[tool.hatch.version]
path = "vibefpmgui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vibefpmgui"]

[tool.hatch.build.targets.sdist]
include = ["/vibefpmgui", "/README.md", "/LICENSE.md", "/pyproject.toml"]  # "/" = top level only

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]   # (the package from this checkout; conftest helpers)
qt_api = "pyside6"
timeout = 120            # pytest-timeout: a test waiting on a dialog fails instead of hanging
# From a watchdog thread: dumps every thread's stack, then ends the run. (The default,
# a signal, only fires when Python runs: a hang inside Qt's event loop never ended.)
timeout_method = "thread"

[tool.bandit]
# Checks that don't apply here (pixi run audit). The app's job is to run
# programs (fpm, the compilers, fortitude, fortls, git, your shell), so:
skips = [
    "B404",  # importing subprocess
    "B603",  # subprocess calls: always argument lists, never shell=True (no shell syntax in names
             # or arguments; a git URL from fpm.toml comes after "--": see dep_updates.ls_remote)
    "B606",  # the Terminal panel starts your shell (os.execve)
    "B607",  # programs found on the PATH by name (git, ps, open, explorer, taskkill): intended
]

[tool.coverage.run]
source = ["vibefpmgui"]
branch = true

[tool.coverage.html]
directory = "web/coverage"   # deployed with the website, linked from the API docs
title = "VibeFPMGUI test coverage"
